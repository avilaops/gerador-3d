<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gerador 3D · catálogo</title>
    <style>
      :root {
        --bg: #f6f5f2;
        --ink: #141413;
        --muted: #6d6a63;
        --line: #e2dfd8;
        --surface: #fff;
        --accent: #96764a;
      }
      * { box-sizing: border-box; margin: 0; }
      body { background: var(--bg); color: var(--ink); font: 15px/1.5 Barlow, Inter, Arial, sans-serif; }
      main { max-width: 1320px; margin: 0 auto; padding: 24px 16px 64px; }
      h1 { font-size: 26px; letter-spacing: -0.01em; }
      .lead { color: var(--muted); margin-top: 4px; }
      .bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0; align-items: center; }
      .bar input { font: inherit; padding: 8px 14px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); min-width: 240px; }
      .chip { font: inherit; font-size: 14px; padding: 7px 14px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); cursor: pointer; }
      .chip[aria-pressed='true'] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
      .count { color: var(--muted); margin-left: auto; font-size: 13px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
      .item { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; cursor: pointer; text-align: left; padding: 0; font: inherit; color: inherit; display: block; width: 100%; }
      .item:hover, .item:focus-visible { border-color: var(--accent); outline: none; }
      .item img { width: 100%; aspect-ratio: 1; display: block; background: #f4f3ef; object-fit: cover; }
      .item .txt { padding: 10px 12px 12px; }
      .code { font-weight: 600; font-size: 12px; letter-spacing: 0.1em; color: var(--accent); }
      .item .name { font-weight: 600; line-height: 1.2; }
      .tag { display: inline-block; font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 1px 8px; margin-top: 6px; }
      .tag.ok { color: #2f7d4a; border-color: #b9d9c4; }
      dialog { border: 0; border-radius: 18px; padding: 0; width: min(1080px, 96vw); max-height: 94vh; background: var(--bg); color: var(--ink); }
      dialog::backdrop { background: rgba(20, 20, 19, 0.55); }
      .detail { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 20px; padding: 20px; }
      @media (max-width: 800px) { .detail { grid-template-columns: 1fr; } }
      .detail h2 { font-size: 24px; line-height: 1.1; }
      .close { position: sticky; float: right; top: 10px; margin: 10px; font: inherit; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 4px 12px; cursor: pointer; z-index: 2; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; margin-top: 12px; }
      td { padding: 5px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
      td:last-child { text-align: right; }
      .ok { color: #2f7d4a; }
      .bad { color: #b8242a; }
      .plan svg { width: 100%; height: auto; display: block; margin-top: 12px; background: var(--surface); border-radius: 12px; }
      .dl { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
      .dl button { font: inherit; font-size: 13px; border: 1px solid var(--ink); background: none; border-radius: 8px; padding: 5px 12px; cursor: pointer; }
      .warn { font-size: 12px; color: var(--accent); margin-top: 8px; }
      body.embed main { padding: 0; max-width: none; }
      body.embed header, body.embed .bar, body.embed .grid { display: none; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Gerador 3D paramétrico</h1>
        <p class="lead">Cada modelo nasce do spec (dimensões + família + mecanismo). Clique para girar, animar e baixar.</p>
      </header>
      <div class="bar" id="bar"></div>
      <div class="grid" id="grid"></div>
      <div id="embed"></div>
    </main>
    <dialog id="dialog"></dialog>
    <script type="module" src="./web/gallery.ts"></script>
  </body>
</html>
